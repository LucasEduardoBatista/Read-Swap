  <link rel="icon" href="./Imagens/icon.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="style.css">

</head>
<body class="d-flex flex-column min-vh-100" id="top">

<nav class="navbar navbar-expand-lg bg-light fixed-top" data-bs-theme="light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html" aria-label="Ir para a página inicial"><span id="logoNav">Read &amp; Swap</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="biblioteca.html">Minha biblioteca</a></li>
          <li class="nav-item"><a class="nav-link" href="swaps.html">Swap</a></li>
          <li class="nav-item"><a class="nav-link active" href="#">Matches</a></li>
          <li class="nav-item"><a class="nav-link" href="premium.html">Premium</a></li>
        </ul>

        <ul class="navbar-nav mb-2 mb-lg-0">
          <li class="nav-item"><a href="login.html" class="nav-link entrar">Entrar</a></li>
          <li class="nav-item"><a href="cadastro.html" class="btn btn-danger cadastrar">Cadastrar</a></li>
        <li style="display:none;">
          <a href="perfil.html" class="nav-link perfil"><i class="bi bi-person-circle"></i></a>
        </li>
          <li><button id="darkModeBtn" onclick="toggleDarkMode()" class="btn"><i class="bi bi-moon-fill"></i></button></li>
        </ul>
      </div>
    </div>
  </nav>


<main class="chat-layout">

  <aside class="conversations-panel">

    <div class="panel-header">
      <h4><i class="bi bi-chat-dots-fill"></i> Mensagens</h4>
    </div>

    <div id="conversationsList" class="p-3 text-muted">Carregando conversas...</div>


  </aside>

  <section class="chat-panel" id="chatPanel">

    <div class="chat-header">
      <button id="chatBack" class="chat-back" type="button" aria-label="Voltar para as conversas"><i class="bi bi-arrow-left"></i></button>
      <img id="chatAvatar" src="./Imagens/default-profile.jpg" class="chat-avatar">
      <div class="chat-user-info">
        <strong id="chatUserName">Selecione uma conversa</strong>
      </div>
      <div class="chat-header-actions">
        <i class="bi bi-three-dots-vertical"></i>
      </div>
    </div>
    <div class="messages" id="chatMessages"><div class="text-muted text-center p-4">Escolha um match para conversar.</div></div>

    <div class="chat-input">
      <input id="chatInput" type="text" class="form-control" maxlength="2000" placeholder="Digite uma mensagem..." disabled>
      <button id="chatSend" class="send-btn" disabled><i class="bi bi-send-fill"></i></button>
    </div>

  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="javascript.js"></script>

</body>
</html>
