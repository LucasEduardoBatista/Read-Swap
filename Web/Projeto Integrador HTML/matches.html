      <a class="navbar-brand" href="index.html"><img id="logoNav" src="./Imagens/logo_navbar.png" style="width: 8rem"></a>

        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Livros
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="biblioteca.html">Meus Livros</a></li>
            <li><a class="dropdown-item" href="livros.html">Cadastro de Livros</a></li>
          </ul>
          <li class="nav-item"><a class="nav-link" href="swaps.html">Swap</a></li>

<main class="chat-layout">

  <aside class="conversations-panel">

    <div class="panel-header">
      <h4><i class="bi bi-chat-dots-fill"></i> Mensagens</h4>
    </div>

    <div class="match-item active" data-chat="chat1">
      <img src="./Imagens/livro2.jpg" class="match-cover">
      <div class="match-info">
        <strong>José A.</strong>
        <span class="last-msg"></span>
        <span class="msg-time"></span>
      </div>
    </div>


  </aside>

  <section class="chat-panel" id="chat1">

    <div class="chat-header">
      <img src="./Imagens/livro2.jpg" class="chat-avatar">
      <div class="chat-user-info">
        <strong>José A.</strong>
        <span class="status online" id="online"><i class="bi bi-circle-fill"></i> Online</span>
      </div>
      <div class="chat-header-actions">
        <i class="bi bi-three-dots-vertical"></i>
      </div>
    </div>
    <!-- Área que vai pro javascript e conecta com o banco-->
    <div class="messages">
      <div class="message received">
        <span class="msg-time"></span>
      </div>
      <div class="message sent">
        <span class="msg-time"></span>
      </div>
    </div>

    <div class="chat-input">
      <input type="text" class="form-control" placeholder="Digite uma mensagem...">
      <button class="send-btn"><i class="bi bi-send-fill"></i></button>
    </div>

  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="javascript.js"></script>
