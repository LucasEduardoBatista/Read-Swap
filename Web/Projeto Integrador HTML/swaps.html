<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark-mode')</script>
  <title>Read & Swap | O melhor site para troca de livros por região</title>
  <link rel="icon" href="./Imagens/icon.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>@import url('https://fonts.googleapis.com/css2?family=Zalando+Sans:ital,wght@0,200..900;1,200..900&display=swap');</style>

  <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100 swaps-page-body" id="top">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-light fixed-top" data-bs-theme="light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html"><img id="logoNav" src="./Imagens/logo_navbar.png" style="width: 8rem"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Livros
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="biblioteca.html">Meus Livros</a></li>
            <li><a class="dropdown-item" href="livros.html">Cadastro de Livros</a></li>
          </ul>
          <li class="nav-item"><a class="nav-link active" href="#">Swap</a></li>
          <li class="nav-item"><a class="nav-link" href="matches.html">Matches</a></li>
          <li class="nav-item"><a class="nav-link" href="premium.html">Premium</a></li>
        </ul>

        <ul class="navbar-nav mb-2 mb-lg-0">
          <li class="nav-item"><a href="login.html" class="nav-link entrar">Entrar</a></li>
          <li class="nav-item"><a href="cadastro.html"><button class="btn btn-danger cadastrar">Cadastrar</button></a></li>
        <li style="display:none;">
          <a href="perfil.html" class="nav-link perfil"><i class="bi bi-person-circle"></i></a>
        </li>
          <li><button id="darkModeBtn" onclick="toggleDarkMode()" class="btn"><i class="bi bi-moon-fill"></i></button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main id="swapMain">
    <h1>Swap</h1>
    <div class="swap-wrapper">
      <aside id="swapOwnerPanel" class="swap-owner-panel" hidden aria-label="Proprietário do livro">
        <img id="swapOwnerPhoto" src="./Imagens/default-profile.jpg" alt="Foto do proprietário">
        <div><span>Livro de</span><strong id="swapOwnerName"></strong><small id="swapOwnerCity"><i class="bi bi-geo-alt-fill"></i></small></div>
      </aside>
      <div id="swapCardContainer" class="swap-card">
        <img src="./Imagens/sem_livros.png" class="swap-cover" alt="Carregando livros">
        <div class="swap-body">
          <h5 id="bookTitle">Carregando livros...</h5>
          <p id="bookDesc">Aguarde um momento.</p>
          <button id="btnDetalhes" class="btn btn-danger btn-sm" disabled>Ver detalhes</button>
          <div id="detalhesConteudo" style="display:none;"></div>
        </div>
      </div>
      <div id="detalhesLateral" class="detalhes-lateral">
        <!-- Conteúdo preenchido via JavaScript -->
      </div>
    </div>
    <div class="swap-actions">
      <button id="btnRecusar" class="swap-btn swap-btn-recusar" aria-label="Recusar livro" disabled><i class="bi bi-x-lg"></i><span>Recusar</span></button>
      <button id="btnCurtir" class="swap-btn swap-btn-curtir" aria-label="Aceitar livro" disabled><i class="bi bi-heart-fill"></i><span>Aceitar</span></button>
    </div>
    <p class="swap-location"><i class="bi bi-geo-alt-fill"></i> Mostrando livros perto de você</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="javascript.js"></script>
</body>
</html>
